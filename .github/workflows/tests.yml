name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
