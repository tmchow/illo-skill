name: Publish illo to ClawHub

# Single-skill repo, so publishing is unconditional on merge — gated only by
# the version: pushes to main publish illo when its SKILL.md version is new
# on ClawHub. An unchanged version is skipped quietly so docs-only merges
# stay green; bump version: in the same PR whenever a change should ship.
# Manual dispatch is strict: an already-published version fails loudly.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog text (default: 'Publish illo <version> from <sha>')"
        required: false
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the v<version> tag + GitHub release on publish

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Authenticate ClawHub CLI
        env:
          CLAW_TOKEN: ${{ secrets.CLAW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLAW_TOKEN:-}" ]; then
            echo "::error::Missing CLAW_TOKEN repository secret"
            exit 1
          fi
          npx -y clawhub@0.20.0 --no-input login --token "$CLAW_TOKEN"
          npx -y clawhub@0.20.0 --no-input whoami

      - name: Publish
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'strict' || 'skip-existing' }}
          CHANGELOG: ${{ inputs.changelog }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SKILL_DIR=skills/illo
          SLUG=illo
          VERSION="$(python3 .github/scripts/skill_frontmatter_version.py "$SKILL_DIR")"
          export VERSION

          set +e
          npx -y clawhub@0.20.0 --no-input inspect "$SLUG" --versions --limit 200 --json > /tmp/clawhub-existing.json 2>/tmp/clawhub-existing.err
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            if grep -qi "Skill not found" /tmp/clawhub-existing.err /tmp/clawhub-existing.json 2>/dev/null; then
              state="new"
            else
              echo "::error::Could not inspect existing ClawHub versions for $SLUG"
              cat /tmp/clawhub-existing.err || true
              cat /tmp/clawhub-existing.json || true
              exit "$rc"
            fi
          else
            state="$(python3 .github/scripts/clawhub_version_state.py /tmp/clawhub-existing.json)"
          fi

          if [ "$state" = "exists" ]; then
            if [ "$MODE" = "strict" ]; then
              echo "::error::ClawHub version $VERSION already exists for $SLUG. Bump version: in $SKILL_DIR/SKILL.md before publishing."
              exit 1
            fi
            echo "::notice::$SLUG $VERSION is already on ClawHub — skipping (bump version: in $SKILL_DIR/SKILL.md to ship a new release)."
            exit 0
          fi

          changelog="${CHANGELOG:-}"
          if [ -z "$changelog" ]; then
            changelog="Publish $SLUG $VERSION from $GITHUB_SHA"
          fi
          npx -y clawhub@0.20.0 --no-input skill publish "$SKILL_DIR" \
            --slug "$SLUG" --version "$VERSION" --changelog "$changelog"
          echo "Published $SLUG@$VERSION"

          # Tag the release: v<version> is what Copilot's `gh skill` resolves
          # versions against and what Gemini CLI's release-based update
          # detection watches. Created only when a new version just shipped.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists — skipping tag."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" \
              --title "illo v$VERSION" --notes "$changelog"
            echo "Tagged and released v$VERSION"
          fi
