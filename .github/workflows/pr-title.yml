name: Conventional PR metadata

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?:[[:space:]]+[^[:space:]].*$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commit format, for example: feat: add a new print look"
            echo "Allowed types: feat, fix, perf, revert, docs, style, refactor, test, build, ci, chore."
            exit 1
          fi

  commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_RELEASE_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.user.type == 'Bot' && github.event.pull_request.head.ref == 'release-please--branches--main--components--illo' }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$TRUSTED_RELEASE_PR" == "true" ]]; then
            args+=(--trusted-release-pr)
          fi
          python3 .github/scripts/validate_pr_commits.py "${args[@]}"
